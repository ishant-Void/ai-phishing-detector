<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PhishGuard AI</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #38bdf8;
    }
    .badge {
      font-size: 10px;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 12px;
      color: #94a3b8;
    }
    label {
      font-size: 11px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #result {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .safe {
      background: rgba(22, 163, 74, 0.15);
      border: 1px solid #22c55e;
    }
    .danger {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid #ef4444;
    }
    .status-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .safe .status-title { color: #4ade80; }
    .danger .status-title { color: #f87171; }
    .meta {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    ul {
      margin: 0;
      padding-left: 18px;
      font-size: 11px;
      color: #e2e8f0;
    }
    li { margin-bottom: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>🛡️ PhishGuard AI</h2>
    <span class="badge">v1.0 MVP</span>
  </div>

  <label for="urlInput">Target Website URL</label>
  <input type="text" id="urlInput" placeholder="https://example.com" />

  <button id="scanBtn">Scan Website</button>

  <div id="result">
    <div class="status-title" id="statusTitle"></div>
    <div class="meta" id="metaInfo"></div>
    <ul id="reasonsList"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
